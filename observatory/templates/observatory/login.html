{% extends "observatory/base.html" %}
{% block title %}Sign in · PEACE-Air{% endblock %}
{% block content %}<div class="login-wrap"><section class="card card-pad login-card">
  <h1>Sign in</h1><p class="muted">Use your PEACE-Air dashboard account.</p>
  {% if form.errors %}<p class="login-error">The username or password is incorrect.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label class="field"><span>Username</span><input class="input" name="username" autocomplete="username" required autofocus></label>
    <label class="field"><span>Password</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</section></div>{% endblock %}
